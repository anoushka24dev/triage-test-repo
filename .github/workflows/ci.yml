name: CI Test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest
      - name: Run Tests
        run: pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}
      # TEMPORARY: forces the build red even when the tests pass, to exercise
      # the triage pipeline rejection path. Remove after that test.
      - name: Deliberate guard failure
        run: |
          echo "guard: failing the build on purpose"
          exit 1
